<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Flat Indigo #4f46e5 -->
  <rect width="512" height="512" rx="128" fill="#4f46e5" />
  
  <!-- Architectural Monogram EK in Solid White #ffffff -->
  <g fill="#ffffff">
    <!-- E Vertical Stem -->
    <path d="M 120 136 h 48 v 240 h -48 Z" />
    
    <!-- E Top Bar -->
    <path d="M 168 136 h 100 v 44 h -100 Z" />
    
    <!-- E Middle Bar -->
    <path d="M 168 234 h 80 v 44 h -80 Z" />
    
    <!-- E Bottom Bar -->
    <path d="M 168 332 h 100 v 44 h -100 Z" />
    
    <!-- K Diagonal Up -->
    <polygon points="268,260 360,136 414,136 308,276" />
    
    <!-- K Diagonal Down -->
    <polygon points="280,246 360,376 418,376 318,220" />
  </g>
</svg>
